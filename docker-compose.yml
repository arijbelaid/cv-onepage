services:
  api:
    image: devsecops-api
    container_name: devsecops-api-container
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - devsecops-network

  frontend:
    image: devsecops-portfolio
    container_name: devsecops-frontend-container
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.159.129:5000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - devsecops-network

networks:
  devsecops-network:
    driver: bridge
